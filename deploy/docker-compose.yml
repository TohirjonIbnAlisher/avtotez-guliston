# avtotez.uz — production stack (serverda: /opt/avtotez/app/deploy).
#
#   db   — PostgreSQL (faqat ichki tarmoqda, port tashqariga ochilmaydi)
#   api  — NestJS backend (api.avtotez.uz)
#
# 80/443 portlarni bu stack EGALLAMAYDI: serverda boshqa loyihalar ham bor va ularni
# serverning o'zidagi umumiy Caddy (systemd) xizmat qiladi. Bizning domenlar o'sha Caddy'ga
# deploy/Caddyfile orqali ulanadi (/etc/caddy/Caddyfile ichida `import` qatori) — frontend
# statik fayllarini Caddy to'g'ridan-to'g'ri diskdan beradi, api esa 127.0.0.1:3010 ga proksi
# (port band bo'lsa: .env da API_PORT=... va deploy/Caddyfile dagi portni birga o'zgartiring).
#
# Maxfiy qiymatlar deploy/.env faylida (git'ga kirmaydi), namuna: .env.example
name: avtotez

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: avtotez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi kerak}
      POSTGRES_DB: avtotez
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avtotez -d avtotez"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://avtotez:${POSTGRES_PASSWORD}@db:5432/avtotez
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env da berilishi kerak}
    volumes:
      - ../data:/app/data:ro
      # rasmlar, videolar va foydalanuvchi avatarlari — serverning diskida doimiy saqlanadi
      - ../backend/public:/app/backend/public
    # faqat localhost'da — tashqaridan emas, serverdagi Caddy orqali kiriladi
    ports:
      - "127.0.0.1:${API_PORT:-3010}:3000"

volumes:
  pgdata:
