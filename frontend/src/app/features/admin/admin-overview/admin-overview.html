<section class="mx-auto max-w-6xl px-6 py-12">
  <a routerLink="/dashboard" class="mb-4 inline-block text-sm font-semibold text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300">
    ← Kabinetga qaytish
  </a>

  <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Boshqaruv paneli</h1>
  <p class="mt-1 text-slate-500 dark:text-slate-400">Tizimni boshqarish bo'limi</p>

  <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
    @for (section of sections(); track section.route) {
      <a
        [routerLink]="section.route"
        class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-slate-900 dark:shadow-none dark:hover:border-slate-700"
      >
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-brand-50 text-2xl dark:bg-brand-500/10">
          {{ section.icon }}
        </div>
        <h2 class="mt-4 text-lg font-bold text-slate-900 dark:text-white">{{ section.title }}</h2>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ section.description }}</p>
      </a>
    }
  </div>
</section>
