<section class="mx-auto max-w-7xl px-6 py-16">
  @if (store.loading()) {
    <p class="animate-pulse text-center text-lg text-slate-500 dark:text-slate-400">{{ translate.t('testRunner.loading') }}</p>
  } @else if (questions().length > 0) {
    <app-test-session
      [questions]="questions()"
      [title]="translate.t('pages.mistakes.heading')"
      [scored]="false"
      [countdown]="false"
      [allowSave]="true"
    />
  } @else {
    <div class="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:shadow-none">
      <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">{{ translate.t('pages.mistakes.heading') }}</h2>
      <p class="mt-2 text-lg text-slate-600 dark:text-slate-300">{{ translate.t('pages.mistakes.empty') }}</p>
    </div>
  }
</section>
