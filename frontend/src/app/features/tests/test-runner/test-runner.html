<section class="mx-auto max-w-7xl px-6 py-16">
  @if (error()) {
    <p class="animate-fade-in-up mb-6 rounded-xl bg-red-50 px-4 py-3 text-base font-medium text-red-600 dark:bg-red-500/10 dark:text-red-400">
      {{ error() }}
    </p>
  }

  @if (!questions() && !loading()) {
    <div class="animate-fade-in-up rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:shadow-none">
      <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white">{{ translate.t('testRunner.idleTitle') }}</h2>
      <p class="mt-2 text-lg text-slate-600 dark:text-slate-300">
        {{ translate.t('testRunner.idleDescription') }}
      </p>
      <button type="button" class="btn-primary mt-6" (click)="startExam()">
        {{ translate.t('testRunner.startBtn') }}
      </button>
    </div>
  }

  @if (loading()) {
    <p class="animate-pulse text-center text-lg text-slate-500 dark:text-slate-400">{{ translate.t('testRunner.loading') }}</p>
  }

  @if (questions(); as qs) {
    <app-test-session
      [questions]="qs"
      [title]="translate.t('testRunner.idleTitle')"
      [scored]="true"
      [countdown]="true"
    />
  }
</section>
