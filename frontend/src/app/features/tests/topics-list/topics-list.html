<section class="mx-auto max-w-6xl px-6 py-12">
  <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">{{ translate.t('pages.topics.heading') }}</h1>

  <input
    type="text"
    [value]="search()"
    (input)="search.set($any($event.target).value)"
    [placeholder]="translate.t('pages.topics.searchPlaceholder')"
    class="mt-5 w-full max-w-md rounded-xl border-2 border-slate-200 px-4 py-2.5 text-base text-slate-900 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
  />

  @if (loading() || store.loading()) {
    <p class="animate-pulse mt-8 text-center text-lg text-slate-500 dark:text-slate-400">{{ translate.t('testRunner.loading') }}</p>
  } @else {
    <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (tile of tiles(); track tile.topic.id) {
        <a
          [routerLink]="['/tests/topics', tile.topic.id]"
          class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-slate-900 dark:shadow-none dark:hover:border-slate-700"
        >
          <div class="font-bold text-slate-900 dark:text-white">{{ tile.topic.name }}</div>
          <div class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            {{ translate.t('pages.topics.questionsCount', { count: tile.count }) }}
          </div>
        </a>
      }
    </div>
  }
</section>
