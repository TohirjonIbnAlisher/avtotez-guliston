<section class="mx-auto max-w-7xl px-6 py-16">
  <a routerLink="/tests/tickets" class="mb-4 inline-block text-sm font-semibold text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300">
    ← {{ translate.t('common.back') }}
  </a>

  @if (loading()) {
    <p class="animate-pulse text-center text-lg text-slate-500 dark:text-slate-400">{{ translate.t('testRunner.loading') }}</p>
  } @else if (ticket(); as t) {
    <app-test-session
      [questions]="t.questions"
      [title]="t.number + ' - bilet'"
      [scored]="true"
      [countdown]="false"
      (completed)="onCompleted($event)"
    />
  } @else {
    <p class="text-center text-lg text-slate-500 dark:text-slate-400">{{ translate.t('common.empty') }}</p>
  }
</section>
