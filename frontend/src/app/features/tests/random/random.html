<section class="mx-auto max-w-7xl px-6 py-16">
  @if (error()) {
    <p class="animate-fade-in-up mb-6 rounded-xl bg-red-50 px-4 py-3 text-base font-medium text-red-600 dark:bg-red-500/10 dark:text-red-400">
      {{ error() }}
    </p>
  }

  @if (!questions() && !loading()) {
    <div class="animate-fade-in-up rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900 dark:shadow-none">
      <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white">{{ translate.t('pages.random.heading') }}</h2>
      <p class="mt-2 text-lg text-slate-600 dark:text-slate-300">{{ translate.t('pages.random.chooseCount') }}</p>
      <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4">
        @for (count of countOptions; track count) {
          <button
            type="button"
            class="rounded-xl border-2 border-slate-200 px-4 py-4 text-xl font-bold text-slate-900 transition hover:border-brand-500 hover:bg-brand-50 dark:border-slate-700 dark:text-white dark:hover:bg-brand-500/10"
            (click)="start(count)"
          >
            {{ count }}
          </button>
        }
      </div>
    </div>
  }

  @if (loading()) {
    <p class="animate-pulse text-center text-lg text-slate-500 dark:text-slate-400">{{ translate.t('testRunner.loading') }}</p>
  }

  @if (questions(); as qs) {
    <app-test-session
      [questions]="qs"
      [title]="translate.t('pages.random.heading')"
      [scored]="true"
      [countdown]="true"
    />
  }
</section>
