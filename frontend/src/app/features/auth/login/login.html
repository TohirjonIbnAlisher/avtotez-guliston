<section class="relative flex min-h-[calc(100vh-73px)] items-center justify-center overflow-hidden bg-gradient-to-b from-brand-50 via-white to-white px-6 py-16">
  <div
    class="animate-blob pointer-events-none absolute -top-24 -left-24 h-96 w-96 rounded-full bg-brand-200/50 blur-3xl"
  ></div>
  <div
    class="animate-blob pointer-events-none absolute -right-24 bottom-0 h-96 w-96 rounded-full bg-brand-300/40 blur-3xl [animation-delay:3s]"
  ></div>

  <div class="animate-fade-in-up relative w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-brand-600/10">
    <div class="mb-8 text-center">
      <a routerLink="/" class="inline-flex items-center gap-2.5">
        <app-logo-mark size="sm" />
        <span class="text-xl font-extrabold tracking-tight text-brand-600">{{ translate.t('common.brand') }}</span>
      </a>
      <h1 class="mt-3 text-2xl font-extrabold text-slate-900">{{ translate.t('login.title') }}</h1>
      <p class="mt-1 text-base text-slate-500">
        {{ translate.t('login.subtitle') }}
      </p>
    </div>

    @if (error()) {
      <p class="mb-5 rounded-xl bg-amber-50 px-4 py-3 text-sm font-medium text-amber-700">
        {{ error() }}
      </p>
    }

    <form class="flex flex-col gap-4" (submit)="$event.preventDefault(); onSubmit()">
      <div>
        <label for="phone" class="mb-1.5 block text-sm font-semibold text-slate-700">
          {{ translate.t('login.labelLogin') }}
        </label>
        <input
          id="phone"
          type="tel"
          autocomplete="tel"
          class="w-full rounded-xl border-2 border-slate-200 px-4 py-3 text-base text-slate-900 transition-colors focus:border-brand-600 focus:outline-none"
          placeholder="+998901234567"
          [value]="phone()"
          (input)="phone.set($any($event.target).value)"
        />
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-semibold text-slate-700">
          {{ translate.t('login.labelPassword') }}
        </label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            class="w-full rounded-xl border-2 border-slate-200 px-4 py-3 pr-12 text-base text-slate-900 transition-colors focus:border-brand-600 focus:outline-none"
            placeholder="••••••••"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute top-1/2 right-3 -translate-y-1/2 text-lg text-slate-400 hover:text-slate-600"
            [attr.aria-label]="showPassword() ? translate.t('login.hidePassword') : translate.t('login.showPassword')"
          >
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary mt-2 w-full" [disabled]="loading()">
        {{ loading() ? translate.t('login.submitLoading') : translate.t('common.login') }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-400">
      <a routerLink="/" class="hover:text-slate-600">← {{ translate.t('login.backHome') }}</a>
    </p>
  </div>
</section>
